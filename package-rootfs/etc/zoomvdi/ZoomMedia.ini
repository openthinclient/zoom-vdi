[ENV]
PATH=/usr/lib/zoomvdi-universal-plugin/
BIN=zoom
LD_LIBRARY_PATH=/usr/lib/zoomvdi-universal-plugin/Qt/lib/
SSB_HOME=~/.zoomvdi
CONFIG_PATH=~/.zoomvdi
[LOG]
MAX_FILE_COUNT=10
MAX_FILE_SIZE=30
[FEATURE]
SHAREOFFLOAD=1
VIRTUALBACKGROUND=1
[DEVICE_LOCATION]
ISINOFFICE=1 ;set IsInOffice=1 for office, 0 for home
[OS]
OS_DISTRO=ubuntu